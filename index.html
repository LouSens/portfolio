<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="David Kurniawan, AI undergraduate and full-stack developer building production-ready web applications, LangGraph AI agent workflows, and high-throughput FastAPI backends. Portfolio for internship and remote part-time opportunities." />
    <meta name="keywords" content="David Kurniawan, Full-Stack Developer, AI Engineer Portfolio, React, FastAPI, LangGraph, pgvector, Machine Learning, Internship, Software Engineer" />
    <meta name="author" content="David Kurniawan" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>David Kurniawan | Full-Stack Developer &amp; AI Systems Engineer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint; text shows in the system font until they arrive. -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Theme is applied before the first paint so a returning visitor never sees a flash of the other one. -->
    <script>
        (function () {
            var t = 'dark';
            try { t = localStorage.getItem('dk-theme') || 'dark'; } catch (e) {}
            document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
            var m = document.createElement('meta');
            m.name = 'theme-color';
            m.content = t === 'light' ? '#f6f5f1' : '#050508';
            document.head.appendChild(m);
        })();
    </script>
    <style>
        html,body{margin:0;background:#050508}
        html[data-theme=light],html[data-theme=light] body{background:#f6f5f1}
        #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#050508;font-family:Inter,system-ui,sans-serif;transition:opacity .7s ease,transform .9s cubic-bezier(.22,1,.36,1),clip-path .9s cubic-bezier(.22,1,.36,1);clip-path:inset(0 0 0 0)}
        #splash.out{opacity:0;transform:translateY(-3%);clip-path:inset(0 0 100% 0);pointer-events:none}
        #splash p{margin:0;font-weight:800;letter-spacing:-0.03em;color:#fff;font-size:clamp(1.75rem,1.1rem + 3.4vw,3.5rem);opacity:0;transform:translateY(10px);animation:splash-in .7s .1s cubic-bezier(.22,1,.36,1) forwards}
        #splash i{font-style:normal;color:#FF5A36}
        #splash span{display:block;height:2px;width:0;margin:1rem auto 0;background:#FF5A36;animation:splash-line .8s .35s cubic-bezier(.22,1,.36,1) forwards}
        @keyframes splash-in{to{opacity:1;transform:none}}
        @keyframes splash-line{to{width:3.5rem}}
        html[data-theme=light] #splash{background:#f6f5f1}
        html[data-theme=light] #splash p{color:#111218}
        @media (prefers-reduced-motion:reduce){#splash p,#splash span{animation-duration:.01s}#splash,#splash.out{transition:opacity .3s;clip-path:none;transform:none}}
    </style>
</head>

<body class="bg-canvas text-white antialiased">
    <div id="root"></div>
    <!-- Name only, shown at once. The app mounts underneath; main.jsx lifts this away once the page is ready. -->
    <div id="splash" aria-hidden="true"><div style="text-align:center"><p>David Kurniawan<i>.</i></p><span></span></div></div>
    <script>
        /* Load-time readout, only when the address ends in ?debug. Shows where the seconds go on a real device. */
        if (location.search.indexOf('debug') > -1) (function () {
            var long = 0, fcp = 0, mount = 0;
            var gaps = [], first = 0, last = performance.now();
            (function tick(t) { if (!first) first = t; if (t - last > 250) gaps.push(Math.round(last) + '+' + Math.round(t - last)); last = t; requestAnimationFrame(tick); })(last);
            try { new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { long += e.duration; }); }).observe({ type: 'longtask', buffered: true }); } catch (e) {}
            try { new PerformanceObserver(function (l) { l.getEntries().forEach(function (e) { if (e.name === 'first-contentful-paint') fcp = e.startTime; }); }).observe({ type: 'paint', buffered: true }); } catch (e) {}
            var mo = new MutationObserver(function () { if (document.querySelector('header')) { mount = performance.now(); mo.disconnect(); } });
            mo.observe(document.getElementById('root'), { childList: true, subtree: true });
            function show() {
                var n = performance.getEntriesByType('navigation')[0] || {}, c = navigator.connection || {}, r = Math.round;
                var res = performance.getEntriesByType('resource').filter(function (e) { return /assets\/(index|react)/.test(e.name); })
                    .map(function (e) { return e.name.split('/').pop().slice(0, 12) + ' ' + r(e.startTime) + '-' + r(e.responseEnd); });
                var lines = [
                    'dns ' + r(n.domainLookupEnd - n.domainLookupStart) + '  connect ' + r(n.connectEnd - n.connectStart),
                    'html first byte ' + r(n.responseStart) + '  html done ' + r(n.responseEnd),
                    'first paint ' + r(fcp) + '  app on screen ' + r(mount),
                    'page load ' + r(n.loadEventEnd) + '  busy ' + r(long),
                    'first frame ' + r(first) + '  freezes(start+length) ' + (gaps.join(' ') || 'none'),
                    res.join(' | '),
                    'net ' + (c.effectiveType || '?') + ' ' + (c.downlink || '?') + 'Mb rtt ' + (c.rtt || '?') + '  mem ' + (navigator.deviceMemory || '?') + 'GB  cpu ' + (navigator.hardwareConcurrency || '?'),
                    screen.width + 'x' + screen.height + ' @' + devicePixelRatio + '  ' + navigator.userAgent
                ];
                var d = document.getElementById('dbg') || document.body.appendChild(document.createElement('pre'));
                d.id = 'dbg';
                d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;margin:0;padding:10px;background:#fff;color:#000;font:11px/1.5 monospace;white-space:pre-wrap;word-break:break-all;border-radius:8px';
                d.textContent = lines.join('\n');
            }
            addEventListener('load', function () { setTimeout(show, 3000); setTimeout(show, 12000); });
        })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
